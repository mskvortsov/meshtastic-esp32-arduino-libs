name: Main workflow
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build libraries v3
    runs-on: ubuntu-latest
    container:
      image: espressif/esp32-arduino-lib-builder:release-v5.4
      volumes:
        - ${{ github.workspace }}:/w
    steps:
      - name: Install zip
        run: apt update && apt install -y zip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Modify configs
        run: |
          for path in `ls /w/configs/defconfig.*`
          do
            config=$(basename $path)
            cat /w/configs/$config >>/opt/esp/lib-builder/configs/$config
          done
      - name: Build
        run: |
          cd /opt/esp/lib-builder/
          GITHUB_REPOSITORY_OWNER=espressif bash -x ./build.sh -t esp32
      - name: Zip artifacts
        run: |
          cd /opt/esp/lib-builder/out/tools/
          zip -r /w/esp32-arduino-libs.zip esp32-arduino-libs
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-arduino-libs-v3
          path: /w/*.zip

  release:
    needs: [build]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32-arduino-libs-v3/*.zip
